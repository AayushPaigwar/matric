<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Matrix Grid -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Pulse Wave -->
  <path d="M10 32 L21 32 L26 18 L33 46 L39 26 L44 32 L54 32" stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Pulse Dot -->
  <circle cx="54" cy="32" r="2.5" fill="#4ade80"/>
</svg>
